<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
  {% comment %}Minima 2.5.x has no custom-head include; keep its head above intact.{% endcomment %}
  {%- if page.layout == 'post' -%}
    <script defer src="{{ '/assets/js/copy-source.js' | relative_url | escape }}"
      data-source-url="{{ page.url | absolute_url | escape }}"></script>
  {%- endif -%}
</head>
